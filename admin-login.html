<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - HealthDesk</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="navbar">

    <div class="logo">
        🩺 HealthDesk
    </div>

    <span class="clinic-name">
        Clinic Administrator
    </span>

</header>


<main class="auth-container">

    <div class="auth-card">

        <div class="medical-icon">
            🏥
        </div>

        <h1>Admin Login</h1>

        <p class="auth-subtitle">
            HealthDesk Clinic Administration
        </p>


        <form id="adminLoginForm">

            <label for="adminEmail">
                Admin Email
            </label>

            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                required
            >


            <label for="adminPassword">
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                required
            >


            <button
                type="submit"
                class="btn primary-btn full-width">

                Login as Admin

            </button>

        </form>


        <p
            id="adminLoginMessage"
            class="form-description">
        </p>


        <p class="switch-text">

            <a href="index.html">
                ← Back to Student Login
            </a>

        </p>

    </div>

</main>


<footer>

    <p>
        HealthDesk © 2026 | School Clinic
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
